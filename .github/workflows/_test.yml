name: Test

on:
  workflow_call:
    secrets:
      GH_APP_PRIVATE_KEY:
        required: true
    inputs:
      retake_snapshots:
        required: false
        default: false
        type: boolean

defaults:
  run:
    shell: bash -l {0}

permissions: {}

jobs:
  TestSwiftPM:
    name: SwiftPM Tests
    runs-on: macos-15
    timeout-minutes: 40
    outputs:
      changed-files: ${{ steps.checkSnapshotChanges.outputs.didChangeFiles }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Setup SwiftPM workspace
        uses: ./.github/actions/spm-setup

      - name: Remove snapshots
        if: ${{inputs.retake_snapshots}}
        run: find . -type d -name "__Snapshots__" -exec rm -rf {}  +;

      - name: Run Backpack Swift Package tests
        env:
          SPM_DESTINATION: platform=iOS Simulator,name=iPhone SE (3rd generation),OS=18.5
        continue-on-error: ${{inputs.retake_snapshots}}
        run: |
          set -eo pipefail
          xcodebuild \
            -workspace .swiftpm/xcode/package.xcworkspace \
            -scheme Backpack-Package \
            -destination "$SPM_DESTINATION" \
            -derivedDataPath .derivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            test

      - name: Check snapshot changes
        id: checkSnapshotChanges
        run: changedFiles=`git status --porcelain` && echo "didChangeFiles=${changedFiles//$'\n'/'%0A'}" >> $GITHUB_OUTPUT

      - name: Save snapshots
        if: ${{inputs.retake_snapshots}}
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config --local user.email "197108191+skyscanner-backpack-bot[bot]@users.noreply.github.com"
          git config --local user.name "skyscanner-backpack-bot[bot]"
          git remote set-url origin https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git
          git fetch origin $GITHUB_HEAD_REF
          git checkout $GITHUB_HEAD_REF
          git add --ignore-removal */**/__Snapshots__/*.png
          git diff-index --quiet HEAD || git commit -m "Updated snapshots"
          git push

      - name: Upload failure diffs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: FailureDiffs
          path: .derivedData/Logs/Test
          if-no-files-found: ignore

      - name: Clean derived data
        if: always()
        run: rm -rf .derivedData

  NotifyChanges:
    name: "Notify about changes made"
    runs-on: ubuntu-22.04
    needs: [TestSwiftPM]
    if: ${{ needs.TestSwiftPM.outputs.changed-files != '' &&  inputs.retake_snapshots}}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Notify PR of screenshots changes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHANGED_FILES: ${{ needs.TestSwiftPM.outputs.changed-files }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            var body = `### Snapshots were updated. Please verify the changes match the expected layout. \n\n>'${process.env.CHANGED_FILES}'`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
