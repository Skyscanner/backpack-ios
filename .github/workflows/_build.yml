name: Build

on:
  workflow_call:
    secrets:
      GH_APP_PRIVATE_KEY:
        required: true

defaults:
  run:
    shell: bash -l {0}

permissions: {}

jobs:
  Setup:
    name: Install Dependencies
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up node and ruby
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1

  Lint:
    name: Lint Project
    runs-on: macos-15
    needs: [Setup]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache_node_modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-

      - name: NPM ci
        if: steps.cache_node_modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run NPM build
        run: npm run build

      - name: Cache Bundler install Gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache_bundler_install_gems
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ env.ImageVersion }}-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-${{ env.ImageVersion }}

      - name: Bundle Install
        run: bundle install --jobs 4 --retry 3

      - name: Select Xcode 16
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app

      - name: Install clang-format
        run: brew install clang-format

      - name: Install SwiftLint
        env:
          SWIFTLINT_VERSION: 0.65.1
          # SHA256 of portable_swiftlint.zip for the version above. Update both
          # together; the job fails closed if the download does not match.
          SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        run: |
          set -eo pipefail
          archive="${RUNNER_TEMP}/swiftlint.zip"
          curl -fsSL -o "$archive" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  ${archive}" | shasum -a 256 -c -
          unzip -q -o "$archive" -d "${RUNNER_TEMP}/swiftlint"
          echo "${RUNNER_TEMP}/swiftlint" >> "$GITHUB_PATH"

      - name: Discard changes to Gemfile.lock
        run: git checkout -- Gemfile.lock

      - name: Check pristine
        run: ./scripts/lint

      - name: Run Swiftlint
        run: swiftlint lint --strict --config .swiftlint.yml
        working-directory: Example

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Run danger
        run: npm run danger
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # The SwiftPM jobs need neither node nor ruby, so they do not wait on Setup.
  # That takes the Setup gate off the critical path.
  BuildSwiftPackage:
    uses: ./.github/workflows/_spm-build.yml

  BuildExampleApp:
    name: Build Example App
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 16
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app

      - name: List Runtimes
        run: xcrun simctl list runtimes

      - name: Build the SwiftPM Example app
        run: ./scripts/ci

  Test:
    name: Test
    uses: ./.github/workflows/_test.yml
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
